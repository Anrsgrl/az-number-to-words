name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (OIDC icin 11.5.1+ gerekiyor)
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm test
      - run: npm publish
